<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa...</title>
    <style>
        body{
            background-color: rgb(82, 82, 199);
            color: white;
            font: normal 14pt Arial;
        }
        h1 {
            color: rgb(224, 224, 48);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já mim livrei da maldição !</p>
    <script>
        // O window.prompt retorna por padrão o valor em string
        let n1 = Number(window.prompt("Digite um número: "))
        let n2 = Number(window.prompt("Digite outro número: "))
        const result = n1 + n2
        // concatenação normal
        window.alert('A soma dos valores é '+result)
        // Concatenação com template String
        window.alert(`A soma de ${n1} + ${n2} é ${result}`)
    </script>
</body>
</html>
