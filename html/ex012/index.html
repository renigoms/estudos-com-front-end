<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos Com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo esta hospedado no meu próprio servidor</p>
    <p><strong>Versão mais simples</strong></p>
    <!-- Hospedar videos assim pode ficar caro, consume muito tráfego ! -->
    <video src="media/meu-video.mp4" width="500" controls poster="images/imagem_desafio.png"></video>
    <p><strong>Versão com vários formatos</strong></p>
    <video controls width="500">
        <source src="media/meu-video.ogv" type="video/ogg">
        <source src="media/meu-video.mp4" type="video/mp4">
        <p>Seu navegador não tem compatibilidade com reprodução de video.</p>
    </video>
    <h1>Inserindo videos do Youtube</h1>
    <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/i7L19SOqbNM?si=tscfubxxKQAGL55k" 
    title="YouTube video player" frameborder="0" allow="accelerometer; 
    autoplay; clipboard-write; encrypted-media; gyroscope; 
    picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen></iframe>
</body>
</html>
