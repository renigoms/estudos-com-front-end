<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio das Tags</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. 
        Passe o mouse sobre os termos para descobrir qual tag deverá 
        utilizar em cada caso.
        <ul type="square">
            <li><abbr title="Use a tag <p>">Parágrafo</abbr></li>
            <li><abbr title="Use a tag <h1>...<h6>">Título</abbr></li>
            <li><abbr title="Use a tag <img>">Imagens</abbr></li>
            <li><abbr title="Use a tag <abbr>">Abreviações</abbr></li>
            <li><abbr title="Use a tag <code>">Código Fonte</abbr></li>
            <li><abbr title="Use as tags <ol> e <li>">Lista Numerada</abbr></li>
            <li><abbr title="Use as tags <ul> e <li>">Lista com demarcadores</abbr></li>
        </ul>
    </p>
</body>
</html>
