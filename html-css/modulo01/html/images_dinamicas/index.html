<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HMTL5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos deferentes ou simplesmente
        aumente e diminua o tamanho do seu navegador.
    </p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" 
        type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" 
        type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexivel">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <h2>Vamos aprender a reproduzir áudios em HTML5.</h2>
    <p>Paradise City - Guns N Roses</p>
    <audio src="../media/GunsNRoses-ParadiseCity.mp3" controls></audio>
    <!-- Formatos aceitos: MP3, WAV e OGG -->
     <h2>Outra Forma</h2>
     <p>Paradise City - Guns N Roses</p>
     <audio preload="metadata" controls loop>
        <source src="../media/GunsNRoses-ParadiseCity.mp3" type="audio/mpeg">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. 
            <a href="../media/GunsNRoses-ParadiseCity.mp3">
                Clique aqui para baixar o arquivo</a>
        </p>
     </audio>
</body>
</html>

<!-- Adapte o tamanho das suas imagens ao tamanho da tela dos seus usuários -->
